name: KRISTIVA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'build/**']
permissions:
  contents: read
concurrency:
  group: kristiva-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  build:
    needs: verify
    strategy:
      matrix:
        app: [marketplace, mobile, merchant, admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: kristiva-${{ matrix.app }}
          path: dist/${{ matrix.app }}
          retention-days: 7
  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kristiva-browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
